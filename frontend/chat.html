<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXU Chat</title>
<style>
:root{--bg:#0a0b10;--fg:#eef0f6;--mut:#9aa0b4;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.15);--acc:#6ea8ff;--accfg:#06101f}
@media (prefers-color-scheme:light){:root{--bg:#eef0f6;--fg:#12141c;--mut:#5a6075;--glass:rgba(255,255,255,.7);--line:rgba(0,0,0,.1);--acc:#2f6bff;--accfg:#fff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:14px}
#setup{margin:18vh auto 0;width:100%;max-width:380px}
#chat{flex:1;display:flex;flex-direction:column;max-width:680px;width:100%;margin:8px auto;min-height:0}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.m{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);background:var(--glass)}
.me{align-self:flex-end;background:var(--acc);color:var(--accfg);border:0}
.err{color:#ff7a7a}
.row{display:flex;gap:8px;margin-top:8px}
input,button{font:inherit;color:var(--fg);border-radius:14px;border:1px solid var(--line);background:var(--glass);padding:12px;width:100%;margin-top:8px}
.row input{margin:0}
button{width:auto;background:var(--acc);color:var(--accfg);border:0;font-weight:600;cursor:pointer}
#go{width:100%}
h2{margin:0 0 4px}small{color:var(--mut)}
</style>
</head>
<body>
<div id="setup" class="glass">
  <h2>AXU Chat</h2>
  <small>Paste your key to start.</small>
  <input id="key" type="password" placeholder="axu_live_...">
  <input id="bot" placeholder="Assistant name (only if your key has several)">
  <button id="go">Start chat</button>
</div>

<div id="chat" hidden>
  <div id="log"></div>
  <div class="row glass">
    <input id="q" placeholder="Type a message" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let key = "", bot = "";

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "m " + (cls || "");
  d.textContent = text;
  $("#log").appendChild(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}

$("#go").onclick = async () => {
  key = $("#key").value.trim();
  bot = $("#bot").value.trim();
  if (!key) return;
  $("#setup").hidden = true;
  $("#chat").hidden = false;
  add("Connected. Ask me something.");
  $("#q").focus();
};

async function send() {
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").value = "";
  add(q, "me");
  const wait = add("...");
  try {
    const url = "/v1/ask?q=" + encodeURIComponent(q) + (bot ? "&assistant=" + encodeURIComponent(bot) : "");
    const r = await fetch(url, {headers: {Authorization: "Bearer " + key}});
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Error " + r.status);
    wait.textContent = j.answer;
  } catch (e) {
    wait.textContent = e.message;
    wait.classList.add("err");
  }
}

$("#send").onclick = send;
$("#q").onkeydown = e => { if (e.key === "Enter") send(); };
$("#key").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
</script>
</body>
</html>
